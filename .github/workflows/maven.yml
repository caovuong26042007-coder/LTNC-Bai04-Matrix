name: CI/CD Automation - Bank System

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Thực thi vòng đời Maven (chạy test và package)
    # Lệnh 'package' sẽ tự động chạy qua pha 'test' trước khi đóng gói ra file .jar
    - name: Run Maven Test and Package
      run: mvn clean package checkstyle:check

    # Triển khai action upload-artifact để lưu giữ tệp .jar
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      # Cờ if: always() đảm bảo artifact vẫn được lưu ngay cả khi test bị lỗi (tùy chọn)
      with:
        name: BankSystem-Executable-JAR
        path: target/*.jar
        retention-days: 7 # Giữ file trên GitHub trong 7 ngày