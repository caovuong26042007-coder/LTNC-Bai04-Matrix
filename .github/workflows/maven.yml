name: CI/CD Automation - Bank System

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    # 1. Cấu hình Matrix Strategy chạy trên 3 hệ điều hành
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    # 2. Gọi biến matrix.os vào đây
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Maven Test and Package
      run: mvn clean package checkstyle:check

    # 3. Thêm hậu tố OS vào tên file để không bị ghi đè lên nhau
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BankSystem-Executable-JAR-${{ matrix.os }}
        path: target/*.jar
        retention-days: 7